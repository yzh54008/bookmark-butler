<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OZON 收藏夹管家</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hd">
    <div class="hd-title">
      <span class="dot"></span>
      <strong>收藏夹管家</strong>
    </div>
    <div class="hd-stat" id="hdStat">加载中…</div>
  </header>

  <div class="search-wrap">
    <input id="q" type="text" placeholder="搜标题、网址、备注、标签…  ↑↓ 选择，回车打开" autocomplete="off" spellcheck="false">
    <button id="clearQ" class="clear-q" title="清空" hidden>×</button>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-f="all">全部</button>
    <button class="chip" data-f="note">有备注</button>
    <button class="chip" data-f="dup">重复</button>
    <button class="chip" data-f="blank">标题为空</button>
  </div>

  <main id="list" class="list">
    <div class="empty">正在读取收藏夹…</div>
  </main>

  <footer class="ft">
    <button id="openAI" class="btn btn-ai">AI 智能整理</button>
    <button id="openManager" class="btn">管理台</button>
    <button id="quickTidy" class="btn">一键整理</button>
  </footer>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
